name: Compile Openloader Stage 1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

    - name: Install Rust Toolchain & Target
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: thumbv6m-none-eabi

    - name: Direct Compilation
      run: |
        cargo build --release
        arm-none-eabi-objcopy -O binary target/thumbv6m-none-eabi/release/openloader stage1.bin

    - name: Upload Openloader Binary
      uses: actions/upload-artifact@v4
      with:
        name: openloader-stage1-payload
        path: stage1.bin
